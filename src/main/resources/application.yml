server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notion-blog
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  exposed:
    generate-ddl: false

notion:
  token: ${NOTION_TOKEN}
  settings-data-source-id: ${NOTION_SETTINGS_DATA_SOURCE_ID}
  source-id: ${NOTION_SOURCE_ID:notion}
  api-version: ${NOTION_API_VERSION:2026-03-11}
  base-url: ${NOTION_BASE_URL:https://api.notion.com/v1}
  request-timeout: ${NOTION_REQUEST_TIMEOUT:10s}
  collection-timeout: ${NOTION_COLLECTION_TIMEOUT:30s}
  max-block-depth: ${NOTION_MAX_BLOCK_DEPTH:32}
  max-block-count: ${NOTION_MAX_BLOCK_COUNT:10000}

blog:
  public-base-url: ${BLOG_PUBLIC_BASE_URL:https://blog.homelab.robinjoon.xyz}
  synchronization:
    enabled: ${BLOG_SYNCHRONIZATION_ENABLED:true}
    interval-ms: ${BLOG_SYNCHRONIZATION_INTERVAL_MS:60000}
    due-batch-size: ${BLOG_SYNCHRONIZATION_DUE_BATCH_SIZE:100}
    success-interval: ${BLOG_SYNCHRONIZATION_SUCCESS_INTERVAL:5m}
    initial-failure-delay: ${BLOG_SYNCHRONIZATION_INITIAL_FAILURE_DELAY:5s}
    maximum-failure-delay: ${BLOG_SYNCHRONIZATION_MAXIMUM_FAILURE_DELAY:5m}
  presentation:
    default-profile-key: notion-default
    assets:
      - key: notion-core
        version: 1
        integrity: sha384-V763UM2y9iSN6rUXr+H4a3GeowrAJqJ53QPBQoJQ9/W3UVee9kfeg7pO3tJJ7V/T
        public-path: /presentation/notion/v1/notion.css
        media-type: text/css
        current: true
      - key: katex-styles
        version: 1
        integrity: sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB
        public-path: /webjars/katex/0.17.0/dist/katex.min.css
        media-type: text/css
        current: true
      - key: notion-enhancements
        version: 1
        integrity: sha384-8FGIk6YzcRYD/nVgH4V1NsyQVFRABYRaeoGSa7h5lcyCrDgneifs9e2TJ3/2zv6b
        public-path: /presentation/notion/enhancements/v1/notion-enhancements.css
        media-type: text/css
        current: true
      - key: notion-database
        version: 1
        integrity: sha384-wpjZ1AgfFhNgEf5oXEty9kkNbOZEaD6/03YoArov4Cu6Gb8TH5c4MglrC5tvClEz
        public-path: /presentation/notion/database/v1/notion-database.css
        media-type: text/css
        current: false
      - key: notion-database
        version: 2
        integrity: sha384-Byoo/32d7jkGQ7JNxVuHliHafA+p+T6pBDKa5QQB7qHS9LR/ibKc9wBtt/XyYJaA
        public-path: /presentation/notion/database/v2/notion-database.css
        media-type: text/css
        current: false
      - key: notion-database
        version: 3
        integrity: sha384-7VCB0fCRGauDBBPBLR9aNEnheWmfm6IEvFTZv+EaXwG5p7upfIx6IhGxcR8HGXC3
        public-path: /presentation/notion/database/v3/notion-database.css
        media-type: text/css
        current: true
      - key: katex-runtime
        version: 1
        integrity: sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs
        public-path: /webjars/katex/0.17.0/dist/katex.min.js
        media-type: application/javascript
        current: true
      - key: notion-tabs
        version: 1
        integrity: sha384-VucbIMH0dIpFjnUI6nyjosBUX+cUDRo82zmVz+TihzIdd4C9WwKtpQ1i06jBFgUy
        public-path: /presentation/notion/v1/notion.js
        media-type: application/javascript
        current: true
      - key: notion-math
        version: 1
        integrity: sha384-knQz/ThENhaPoCo7vG4+Zrmeh8Ut2aMQXiEOrgNMT/oxoT8PHnp+G/d+BDgJoScj
        public-path: /presentation/notion/math/v1/notion-math.js
        media-type: application/javascript
        current: true
      - key: notion-database-behavior
        version: 1
        integrity: sha384-lG0eCTZ89mtvozPfU6CHLuBi7bmoXFxZBmN7IgVzOEz+hlWJRvikOx3YyBXdF7Qe
        public-path: /presentation/notion/database/v2/notion-database.js
        media-type: application/javascript
        current: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
