<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${page.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${page.title + ' · ' + page.siteName}">Post · Site</title>
    <meta th:if="${page.description != null}" name="description" th:content="${page.description}">
    <link th:if="${page.canonicalUrl != null}" rel="canonical" th:href="${page.canonicalUrl}">
    <meta property="og:type" th:content="${page.openGraph.type}">
    <meta property="og:title" th:content="${page.title}">
    <meta th:if="${page.description != null}" property="og:description" th:content="${page.description}">
    <meta property="og:site_name" th:content="${page.siteName}">
    <meta property="og:locale" th:content="${page.openGraph.locale}">
    <meta th:if="${page.openGraph.url != null}" property="og:url" th:content="${page.openGraph.url}">
    <meta th:if="${page.openGraph.publishedTime != null}" property="article:published_time" th:content="${page.openGraph.publishedTime}">
    <meta th:if="${page.openGraph.modifiedTime != null}" property="article:modified_time" th:content="${page.openGraph.modifiedTime}">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json" th:utext="${page.jsonLd}"></script>
    <link th:if="${page.faviconHref != null}" rel="icon" th:href="${page.faviconHref}">
    <link th:if="${page.feedUrl != null}" rel="alternate" type="application/rss+xml" th:href="${page.feedUrl}">
    <link th:each="asset : ${page.styleSheets}" rel="stylesheet" th:href="${asset.publicPath}"
          th:type="${asset.mediaType}" th:integrity="${asset.integrity}" crossorigin="anonymous">
    <script th:each="asset : ${page.scripts}" th:src="${asset.publicPath}" th:type="${asset.mediaType}"
            th:integrity="${asset.integrity}" crossorigin="anonymous" defer></script>
</head>
<body>
<main class="notion-page" th:classappend="${#strings.listJoin(page.profile.classes, ' ')}">
    <header th:if="${page.header != null}" class="notion-page-header">
        <th:block th:replace="~{blog/fragments :: document(${page.header})}"></th:block>
    </header>
    <article class="notion-content">
        <h1 class="notion-title" th:text="${page.post.title}">Post title</h1>
        <th:block th:replace="~{blog/fragments :: blocks(${page.post.blocks})}"></th:block>
    </article>
    <footer th:if="${page.footer != null}" class="notion-page-footer">
        <th:block th:replace="~{blog/fragments :: document(${page.footer})}"></th:block>
    </footer>
    <p th:if="${page.feedUrl != null}"><a th:href="${page.feedUrl}">RSS 구독</a></p>
</main>
</body>
</html>
