<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="document(document)">
    <section class="notion-content">
        <th:block th:replace="~{blog/fragments :: blocks(${document.blocks})}"></th:block>
    </section>
</th:block>

<th:block th:fragment="blocks(blocks)">
    <th:block th:each="block : ${blocks}">
        <th:block th:replace="~{blog/fragments :: block(${block})}"></th:block>
    </th:block>
</th:block>

<th:block th:fragment="children(block)">
    <section th:if="${!#lists.isEmpty(block.children)}" class="notion-children">
        <th:block th:replace="~{blog/fragments :: blocks(${block.children})}"></th:block>
    </section>
</th:block>

<th:block th:fragment="inline(inline)">
    <a th:if="${inline.link != null}" th:href="${inline.link.href}"
       th:target="${inline.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? '_blank' : null}"
       th:rel="${inline.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? 'noopener noreferrer' : null}">
        <th:block th:replace="~{blog/fragments :: inlineContent(${inline})}"></th:block>
    </a>
    <th:block th:unless="${inline.link != null}">
        <th:block th:replace="~{blog/fragments :: inlineContent(${inline})}"></th:block>
    </th:block>
</th:block>

<th:block th:fragment="inlineContent(inline)">
    <span th:classappend="${#strings.listJoin(inline.annotations.classes, ' ')}">
        <strong th:remove="${inline.annotations.bold ? 'none' : 'tag'}">
            <em th:remove="${inline.annotations.italic ? 'none' : 'tag'}">
                <s th:remove="${inline.annotations.strikethrough ? 'none' : 'tag'}">
                    <u th:remove="${inline.annotations.underline ? 'none' : 'tag'}">
                        <code th:remove="${inline.annotations.code ? 'none' : 'tag'}">
                            <span th:if="${inline.kind.name() == 'TEXT'}" th:text="${inline.text}">text</span>
                            <code th:if="${inline.kind.name() == 'EQUATION'}" class="notion-math notion-math-inline"
                                  th:attr="data-expression=${inline.expression}" th:text="${inline.expression}">equation</code>
                            <span th:if="${inline.kind.name() == 'MENTION'}" class="notion-mention" th:text="${inline.label}">mention</span>
                        </code>
                    </u>
                </s>
            </em>
        </strong>
    </span>
</th:block>

<th:block th:fragment="inlines(inlines)">
    <th:block th:each="inline : ${inlines}">
        <th:block th:replace="~{blog/fragments :: inline(${inline})}"></th:block>
    </th:block>
</th:block>

<th:block th:fragment="figureCaption(caption)">
    <figcaption th:if="${!#lists.isEmpty(caption)}" class="notion-caption">
        <th:block th:replace="~{blog/fragments :: inlines(${caption})}"></th:block>
    </figcaption>
</th:block>

<th:block th:fragment="description(description)">
    <div th:if="${!#lists.isEmpty(description)}" class="notion-caption">
        <th:block th:replace="~{blog/fragments :: inlines(${description})}"></th:block>
    </div>
</th:block>

<th:block th:fragment="icon(icon, placementClass)">
    <span th:if="${icon instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.EmojiIconView)}"
          class="notion-block-icon" th:classappend="${placementClass}" aria-hidden="true" th:text="${icon.value}">!</span>
    <img th:if="${icon instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.MediaIconView) and icon.url != null}"
         class="notion-block-icon" th:classappend="${placementClass}" th:src="${icon.url}" alt="" aria-hidden="true">
    <span th:if="${icon instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.NativeIconView)}"
          class="notion-block-icon notion-native-icon" th:classappend="${placementClass + (icon.colorClass != null ? ' ' + icon.colorClass : '')}"
          th:title="${icon.name}" aria-hidden="true" th:text="${#strings.replace(icon.name, '-', ' ')}">icon</span>
    <img th:if="${icon instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.CustomEmojiIconView) and icon.url != null}"
         class="notion-block-icon notion-custom-emoji" th:classappend="${placementClass}" th:src="${icon.url}"
         th:title="${icon.name}" alt="" aria-hidden="true">
</th:block>

<th:block th:fragment="block(block)">
    <div th:if="${block.kind.name() == 'PARAGRAPH'}" class="notion-block notion-paragraph"
       th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}">
        <p><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block></p>
        <th:block th:replace="~{blog/fragments :: children(${block})}"></th:block>
    </div>

    <th:block th:if="${block.kind.name() == 'HEADING'}">
        <details th:if="${block.toggleable}" class="notion-block notion-heading-toggle" th:id="${block.id}"
                 th:classappend="${#strings.listJoin(block.style.classes, ' ')}">
            <summary><span class="notion-heading" role="heading" th:attr="aria-level=${block.level.name() == 'ONE' ? 1 : block.level.name() == 'TWO' ? 2 : block.level.name() == 'THREE' ? 3 : 4}">
                <th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block>
            </span></summary>
            <th:block th:replace="~{blog/fragments :: children(${block})}"></th:block>
        </details>
        <th:block th:if="${!block.toggleable and block.level.name() == 'ONE'}"><h1 class="notion-block notion-heading notion-heading-1" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block></h1><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></th:block>
        <th:block th:if="${!block.toggleable and block.level.name() == 'TWO'}"><h2 class="notion-block notion-heading notion-heading-2" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block></h2><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></th:block>
        <th:block th:if="${!block.toggleable and block.level.name() == 'THREE'}"><h3 class="notion-block notion-heading notion-heading-3" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block></h3><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></th:block>
        <th:block th:if="${!block.toggleable and block.level.name() == 'FOUR'}"><h4 class="notion-block notion-heading notion-heading-4" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block></h4><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></th:block>
    </th:block>

    <blockquote th:if="${block.kind.name() == 'QUOTE'}" class="notion-block notion-quote" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></blockquote>
    <details th:if="${block.kind.name() == 'TOGGLE'}" class="notion-block notion-toggle" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><summary><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block></summary><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></details>
    <aside th:if="${block.kind.name() == 'CALLOUT'}" class="notion-block notion-callout" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: icon(${block.icon}, 'notion-callout-icon')}"></th:block><div><th:block th:replace="~{blog/fragments :: inlines(${block.content})}"></th:block><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></div></aside>
    <hr th:if="${block.kind.name() == 'DIVIDER'}" class="notion-block notion-divider" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}">
    <figure th:if="${block.kind.name() == 'CODE'}" class="notion-block notion-code" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ') + ' ' + block.language.cssClass}"><pre><code th:text="${block.content}">code</code></pre><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block><th:block th:replace="~{blog/fragments :: figureCaption(${block.caption})}"></th:block></figure>
    <figure th:if="${block.kind.name() == 'EQUATION'}" class="notion-block notion-equation" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><code class="notion-math notion-math-block" th:attr="data-expression=${block.expression}" th:text="${block.expression}">expression</code><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></figure>

    <th:block th:if="${block.kind.name() == 'LIST'}">
        <ul th:if="${block.type.name() == 'BULLETED' or block.type.name() == 'TODO'}" class="notion-block notion-list" th:classappend="${' notion-list-' + block.type.name().toLowerCase() + ' ' + #strings.listJoin(block.style.classes, ' ')}">
            <li th:each="item : ${block.items}" th:id="${item.id}" th:classappend="${#strings.listJoin(item.style.classes, ' ')}"><label th:if="${item instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.TodoListItemView)}" class="notion-to-do"><input type="checkbox" disabled th:checked="${item.checked}" th:attr="aria-label=${'To-do: ' + item.id}"><span><th:block th:replace="~{blog/fragments :: inlines(${item.content})}"></th:block></span></label><th:block th:unless="${item instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.TodoListItemView)}"><th:block th:replace="~{blog/fragments :: inlines(${item.content})}"></th:block></th:block><th:block th:replace="~{blog/fragments :: children(${item})}"></th:block></li>
        </ul>
        <ol th:if="${block.type.name() == 'NUMBERED'}" class="notion-block notion-list notion-list-numbered" th:start="${block.startNumber}" th:type="${block.numberFormat.name() == 'LOWER_ALPHA' ? 'a' : block.numberFormat.name() == 'UPPER_ALPHA' ? 'A' : block.numberFormat.name() == 'LOWER_ROMAN' ? 'i' : block.numberFormat.name() == 'UPPER_ROMAN' ? 'I' : null}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><li th:each="item : ${block.items}" th:id="${item.id}" th:classappend="${#strings.listJoin(item.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: inlines(${item.content})}"></th:block><th:block th:replace="~{blog/fragments :: children(${item})}"></th:block></li></ol>
    </th:block>

    <section th:if="${block.kind.name() == 'COLUMN_LIST'}" class="notion-block notion-columns" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><section th:each="column : ${block.columns}" class="notion-column" th:id="${column.id}" th:classappend="${#strings.listJoin(column.style.classes, ' ') + (column.widthClass != null ? ' ' + column.widthClass.cssClass : '')}"><th:block th:replace="~{blog/fragments :: blocks(${column.children})}"></th:block></section></section>

    <th:block th:if="${block.kind.name() == 'TAB_CONTAINER'}"><th:block th:if="${block.collapseSingleTab and #lists.size(block.tabs) == 1}"><th:block th:replace="~{blog/fragments :: blocks(${block.tabs[0].children})}"></th:block></th:block><section th:unless="${block.collapseSingleTab and #lists.size(block.tabs) == 1}" class="notion-block notion-tabs" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><div role="tablist" aria-label="Tabs"><a th:each="tab, status : ${block.tabs}" role="tab" th:id="${'tab-' + tab.id}" th:href="${'#panel-' + tab.id}" th:attr="aria-controls=${'panel-' + tab.id},aria-selected=${status.first}"><th:block th:replace="~{blog/fragments :: icon(${tab.icon}, 'notion-tab-icon')}"></th:block><th:block th:replace="~{blog/fragments :: inlines(${tab.title})}"></th:block></a></div><section th:each="tab, status : ${block.tabs}" role="tabpanel" th:id="${'panel-' + tab.id}" th:attr="aria-labelledby=${'tab-' + tab.id}"><th:block th:replace="~{blog/fragments :: blocks(${tab.children})}"></th:block></section></section></th:block>

    <div th:if="${block.kind.name() == 'TABLE'}" class="notion-block notion-table-wrapper" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><table class="notion-table"><thead th:if="${block.hasColumnHeader}"><tr th:with="row=${block.rows[0]}"><th th:each="cell, cellStatus : ${row.cells}" scope="col"><th:block th:replace="~{blog/fragments :: inlines(${cell})}"></th:block></th></tr></thead><tbody><tr th:each="row, rowStatus : ${block.rows}" th:if="${!block.hasColumnHeader or !rowStatus.first}"><th th:if="${block.hasRowHeader}" scope="row"><th:block th:replace="~{blog/fragments :: inlines(${row.cells[0]})}"></th:block></th><td th:each="cell, cellStatus : ${row.cells}" th:if="${!block.hasRowHeader or !cellStatus.first}"><th:block th:replace="~{blog/fragments :: inlines(${cell})}"></th:block></td></tr></tbody></table></div>
    <div th:if="${block.kind.name() == 'TABLE_ROW'}" class="notion-block notion-table-row" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></div>

    <th:block th:if="${block.kind.name() == 'DATA_TABLE'}"><th:block th:replace="~{blog/data-views :: table(${block})}"></th:block></th:block>
    <th:block th:if="${block.kind.name() == 'DATA_LIST'}"><th:block th:replace="~{blog/data-views :: list(${block})}"></th:block></th:block>
    <th:block th:if="${block.kind.name() == 'DATA_GALLERY'}"><th:block th:replace="~{blog/data-views :: gallery(${block})}"></th:block></th:block>

    <figure th:if="${block.kind.name() == 'MEDIA'}" class="notion-block notion-figure" th:id="${block.id}" th:classappend="${' notion-' + block.type.name().toLowerCase() + ' ' + #strings.listJoin(block.style.classes, ' ')}"><img th:if="${block.type.name() == 'IMAGE' and block.url != null}" th:src="${block.url}" th:alt="${block.fileName ?: 'Image'}"><video th:if="${block.type.name() == 'VIDEO' and block.url != null}" controls th:src="${block.url}">Video unavailable</video><audio th:if="${block.type.name() == 'AUDIO' and block.url != null}" controls th:src="${block.url}">Audio unavailable</audio><a th:if="${(block.type.name() == 'FILE' or block.type.name() == 'PDF') and block.url != null}" th:href="${block.url}" target="_blank" rel="noopener noreferrer" th:text="${block.fileName ?: 'Download file'}">Download file</a><p th:if="${block.url == null}">Media unavailable</p><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block><th:block th:replace="~{blog/fragments :: figureCaption(${block.caption})}"></th:block></figure>
    <aside th:if="${block.kind.name() == 'BOOKMARK' or block.kind.name() == 'LINK_PREVIEW'}" class="notion-block" th:id="${block.id}" th:classappend="${(block.kind.name() == 'BOOKMARK' ? ' notion-bookmark ' : ' notion-link-preview ') + #strings.listJoin(block.style.classes, ' ')}"><a th:if="${block.url != null}" th:href="${block.url}" target="_blank" rel="noopener noreferrer" th:text="${block.url}">External link</a><p th:if="${block.url == null}">External link unavailable</p><th:block th:if="${block.kind.name() == 'BOOKMARK'}" th:replace="~{blog/fragments :: description(${block.caption})}"></th:block><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></aside>
    <figure th:if="${block.kind.name() == 'EMBED'}" class="notion-block notion-embed" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><iframe th:if="${block.url != null}" th:src="${block.url}" th:title="${block.provider.name() + ' embedded content'}" sandbox="allow-scripts allow-same-origin allow-popups allow-presentation" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><a th:if="${block.url == null and block.fallbackUrl != null}" th:href="${block.fallbackUrl}" target="_blank" rel="noopener noreferrer">Open embedded content</a><p th:if="${block.url == null and block.fallbackUrl == null}">Embedded content unavailable</p><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block><th:block th:replace="~{blog/fragments :: figureCaption(${block.caption})}"></th:block></figure>

    <nav th:if="${block.kind.name() == 'BREADCRUMB'}" class="notion-block notion-breadcrumb" aria-label="Breadcrumb" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><ol><li th:each="item : ${block.items}"><a th:if="${item.link != null}" th:href="${item.link.href}" th:target="${item.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? '_blank' : null}" th:rel="${item.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? 'noopener noreferrer' : null}" th:text="${item.label}">Link</a><span th:if="${item.link == null}" aria-current="page" th:text="${item.label}">Current page</span></li></ol><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></nav>
    <nav th:if="${block.kind.name() == 'TABLE_OF_CONTENTS'}" class="notion-block notion-toc" aria-label="Table of contents" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><ol><li th:each="entry : ${block.entries}" th:classappend="${' notion-toc-level-' + entry.level.name().toLowerCase()}"><a th:href="${entry.href}" th:text="${entry.label}">Heading</a></li></ol><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></nav>
    <aside th:if="${block.kind.name() == 'CHILD_POST' or block.kind.name() == 'DOCUMENT_LINK' or block.kind.name() == 'DATABASE_LINK'}" class="notion-block notion-document-reference" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ') + (block.kind.name() == 'DATABASE_LINK' ? ' notion-database' : '')}" th:with="label=${block.kind.name() == 'CHILD_POST' ? block.title : block.kind.name() == 'DOCUMENT_LINK' ? 'Linked document' : block.title != null ? block.title : 'Linked database'}"><h2 th:if="${block.kind.name() == 'DATABASE_LINK'}" class="notion-database-title"><a th:if="${block.link != null}" th:href="${block.link.href}" th:target="${block.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? '_blank' : null}" th:rel="${block.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? 'noopener noreferrer' : null}" th:text="${label}">Database</a><span th:if="${block.link == null}" th:text="${label}">Linked database</span></h2><th:block th:unless="${block.kind.name() == 'DATABASE_LINK'}"><a th:if="${block.link != null}" th:href="${block.link.href}" th:target="${block.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? '_blank' : null}" th:rel="${block.link instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? 'noopener noreferrer' : null}" th:text="${label}">Document</a><span th:if="${block.link == null}" th:text="${label}">Linked document</span></th:block><span th:if="${block.link == null and (block.kind.name() != 'DATABASE_LINK' or #lists.isEmpty(block.children))}" class="notion-sr-only"> unavailable</span><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></aside>
    <section th:if="${block.kind.name() == 'SYNCHRONIZED'}" class="notion-block notion-synced-block" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><p th:if="${#lists.isEmpty(block.children)}">Synchronized content</p><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></section>
    <section th:if="${block.kind.name() == 'TEMPLATE'}" class="notion-block notion-template" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><p class="notion-template-title"><th:block th:if="${#lists.isEmpty(block.title)}">Template content</th:block><th:block th:unless="${#lists.isEmpty(block.title)}" th:replace="~{blog/fragments :: inlines(${block.title})}"></th:block></p><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></section>
    <aside th:if="${block.kind.name() == 'MEETING_NOTES'}" class="notion-block notion-meeting-notes" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><h2 th:text="${block.title}">Meeting notes</h2><p th:text="${block.status.label}">Status</p><th:block th:replace="~{blog/fragments :: inlines(${block.summary})}"></th:block><a th:if="${block.notesLink != null}" th:href="${block.notesLink.href}" th:target="${block.notesLink instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? '_blank' : null}" th:rel="${block.notesLink instanceof T(xyz.robinjoon.notionblog.adapter.inbound.web.view.ExternalLinkView) ? 'noopener noreferrer' : null}">Meeting notes link</a><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></aside>
    <aside th:if="${block.kind.name() == 'UNSUPPORTED'}" class="notion-block notion-unsupported" th:id="${block.id}" th:classappend="${#strings.listJoin(block.style.classes, ' ')}"><p th:text="${'Unsupported block: ' + block.originalType}">Unsupported block</p><th:block th:replace="~{blog/fragments :: children(${block})}"></th:block></aside>
</th:block>
