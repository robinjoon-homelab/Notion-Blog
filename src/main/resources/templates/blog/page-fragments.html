<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(chrome, title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' · ' + chrome.siteName}">Post · Site</title>
    <meta th:if="${chrome.description != null}" name="description" th:content="${chrome.description}">
    <link th:if="${chrome.faviconHref != null}" rel="icon" th:href="${chrome.faviconHref}">
    <link th:if="${chrome.feedUrl != null}" rel="alternate" type="application/rss+xml" th:href="${chrome.feedUrl}">
    <link th:each="asset : ${chrome.styleSheets}" rel="stylesheet" th:href="${asset.publicPath}"
          th:type="${asset.mediaType}" th:integrity="${asset.integrity}" crossorigin="anonymous">
    <link rel="stylesheet" href="/ui/notion-shell.css">
    <script th:each="asset : ${chrome.scripts}" th:src="${asset.publicPath}" th:type="${asset.mediaType}"
            th:integrity="${asset.integrity}" crossorigin="anonymous" defer></script>
</head>
<body>
<header th:fragment="header(chrome)" th:if="${chrome.header != null}" class="notion-page-header">
    <th:block th:replace="~{blog/fragments :: document(${chrome.header})}"></th:block>
</header>
<footer th:fragment="footer(chrome)" th:if="${chrome.footer != null}" class="notion-page-footer">
    <th:block th:replace="~{blog/fragments :: document(${chrome.footer})}"></th:block>
</footer>
<nav th:fragment="homeTabs(tabs)" class="nb-home-tabs" aria-label="블로그 탐색">
    <a th:each="tab : ${tabs}" class="nb-filter" th:href="${tab.href}" th:text="${tab.label}"
       th:attr="aria-current=${tab.current ? 'page' : null}">글</a>
</nav>
<article th:fragment="article(page)" class="notion-content">
    <img th:if="${page.properties.coverHref != null}" class="nb-cover" th:src="${page.properties.coverHref}" alt="">
    <h1 class="notion-title" th:text="${page.title}">Post title</h1>
    <details class="nb-series-toc" th:if="${page.series != null}">
        <summary><span th:text="${'시리즈 · ' + page.series.title}">시리즈 · 이름</span>
            <span class="nb-count" th:text="${page.series.position + ' / ' + #lists.size(page.series.entries)}">2 / 5</span></summary>
        <ol>
            <li th:each="entry : ${page.series.entries}" th:attr="aria-current=${entry.current ? 'page' : null}">
                <span th:if="${entry.current}" th:text="${entry.title}">현재 글</span>
                <a th:unless="${entry.current}" th:href="${entry.href}" th:text="${entry.title}">다른 글</a>
            </li>
        </ol>
        <p class="nb-small"><a th:href="${page.series.href}">시리즈 전체 보기</a></p>
    </details>
    <div class="nb-properties" th:if="${page.properties.summary != null or !#lists.isEmpty(page.properties.categories) or page.properties.publishedOn != null}">
        <div class="nb-property" th:if="${page.properties.summary != null}"><span>요약</span><span th:text="${page.properties.summary}">요약</span></div>
        <div class="nb-property" th:if="${!#lists.isEmpty(page.properties.categories)}"><span>태그</span>
            <span><a th:each="category : ${page.properties.categories}" class="nb-badge nb-category-badge" th:href="${category.href}" th:text="${category.name}">태그</a></span></div>
        <div class="nb-property" th:if="${page.properties.publishedOn != null}"><span>발행일</span><span th:text="${page.properties.publishedOn}">2026. 10. 16.</span></div>
    </div>
    <th:block th:replace="~{blog/fragments :: blocks(${page.post.blocks})}"></th:block>
    <nav class="nb-series-pager" aria-label="시리즈 이전·다음" th:if="${page.series != null and (page.series.previous != null or page.series.next != null)}">
        <a th:if="${page.series.previous != null}" class="nb-series-prev" th:href="${page.series.previous.href}">
            <span class="nb-small nb-muted">← 이전 글</span><span th:text="${page.series.previous.title}">이전 글 제목</span></a>
        <a th:if="${page.series.next != null}" class="nb-series-next" th:href="${page.series.next.href}">
            <span class="nb-small nb-muted">다음 글 →</span><span th:text="${page.series.next.title}">다음 글 제목</span></a>
    </nav>
</article>
</body>
</html>
