<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('시리즈')}"></head>
<body th:replace="~{ui/layout :: shell('series', ~{::section})}">
<section>
    <div class="ui-page-head">
        <div>
            <h1>시리즈</h1>
            <p class="ui-muted nb-lead">순서대로 읽는 글 묶음입니다. 글 하나는 시리즈 하나에만 속하고, 내 블로그에는 공개된 글만 순서대로 보입니다. 시리즈를 삭제해도 글, 태그, 공개 상태는 그대로입니다.</p>
        </div>
    </div>

    <p th:replace="~{ui/layout :: notice(${view.notice?.text}, ${view.notice?.error})}"></p>

    <form class="ui-panel" th:action="@{/admin/series}" method="post" aria-label="시리즈 추가">
        <div class="nb-inline-form">
            <div class="ui-field">
                <label for="new-series-title">새 시리즈 제목</label>
                <input class="ui-input" id="new-series-title" type="text" name="title" required maxlength="100" autocomplete="off">
            </div>
            <div class="ui-field">
                <label for="new-series-description">짧은 설명 (선택)</label>
                <input class="ui-input" id="new-series-description" type="text" name="description" maxlength="300" autocomplete="off">
            </div>
            <button class="ui-button ui-button-primary" type="submit">추가</button>
        </div>
    </form>

    <th:block th:if="${#lists.isEmpty(view.rows)}">
        <div th:replace="~{ui/layout :: emptyState('아직 시리즈가 없습니다.', '제목을 입력해 첫 시리즈를 추가하세요.')}"></div>
    </th:block>
    <div class="ui-table-wrap" th:if="${!#lists.isEmpty(view.rows)}">
        <table class="ui-table">
            <caption>시리즈 목록</caption>
            <thead>
            <tr>
                <th scope="col">시리즈</th>
                <th scope="col">글</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${view.rows}">
                <td>
                    <a class="nb-post-title" th:href="@{/admin/series/{id}(id=${row.id})}" th:text="${row.title}">시리즈 제목</a>
                    <p class="nb-post-summary" th:if="${!#strings.isEmpty(row.description)}" th:text="${row.description}">설명</p>
                </td>
                <td class="nb-nowrap" th:text="${'글 ' + row.postCount + '개 · 공개 ' + row.publicPostCount + '개'}">글 0개</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
