<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('글 관리')}"></head>
<body th:replace="~{ui/layout :: shell('posts', ~{::section})}">
<section>
    <div class="ui-page-head">
        <div>
            <h1>글 관리</h1>
            <p class="ui-muted nb-lead">본문은 Notion에서 작성하고, 발행은 여기에서 확인합니다. 새 글은 연결된 Notion 글 데이터베이스에서 작성하세요.</p>
        </div>
    </div>

    <p th:replace="~{ui/layout :: notice(${page.notice?.text}, ${page.notice?.error})}"></p>

    <div class="ui-toolbar">
        <nav class="ui-toolbar" aria-label="상태 필터">
            <a th:each="filter : ${page.filters}" class="nb-filter" th:href="${filter.href}" th:text="${filter.label}"
               th:attr="aria-current=${filter.current ? 'true' : null}">전체</a>
        </nav>
        <form class="ui-toolbar" th:action="@{/admin/posts}" method="get" role="search">
            <input th:unless="${#strings.isEmpty(page.search.status)}" type="hidden" name="status" th:value="${page.search.status}">
            <input class="ui-input nb-search-input" type="search" name="q" th:value="${page.search.query}" placeholder="제목 검색" aria-label="제목 검색">
            <button class="ui-button" type="submit">검색</button>
        </form>
    </div>
    <p class="ui-muted" th:text="${page.allNote}">전체에는 보관한 글이 들어 있지 않습니다.</p>

    <div th:if="${!#lists.isEmpty(page.rows)}" class="ui-table-wrap">
        <table class="ui-table">
            <caption>글 목록</caption>
            <thead>
            <tr>
                <th scope="col">이름</th>
                <th scope="col">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${page.rows}">
                <td>
                    <a class="nb-post-title" th:href="${row.href}" th:text="${row.title}">제목</a>
                    <p class="nb-post-summary">최근 가져옴 <span th:text="${row.source.capturedAt}">2026-10-16 14:20</span> ·
                        <a th:href="${row.source.editUrl}" target="_blank" rel="noopener noreferrer">Notion에서 열기 ↗</a></p>
                    <p class="nb-post-summary" th:if="${row.source.problem != null}" th:text="${row.source.problem}">문제</p>
                    <p class="nb-post-summary" th:if="${row.source.mediaNotice != null}" th:text="${row.source.mediaNotice}">파일</p>
                </td>
                <td><span th:replace="~{app/admin/fragments :: badges(${row.badges})}"></span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <th:block th:if="${#lists.isEmpty(page.rows)}" th:with="unfiltered=${#strings.isEmpty(page.search.query) and #strings.isEmpty(page.search.status)}">
        <div th:replace="~{ui/layout :: emptyState(${unfiltered ? '아직 글이 없습니다' : '조건에 맞는 글이 없습니다'}, ${unfiltered ? '연결된 Notion 데이터베이스에 글을 쓰면 가져온 뒤 여기에 나타납니다. 잠시 기다려 주세요.' : '검색어나 필터를 바꿔 보세요.'})}"></div>
    </th:block>

    <nav class="nb-pager" aria-label="쪽 이동" th:if="${page.pagination.totalPages > 1}">
        <a th:if="${page.pagination.previousHref != null}" th:href="${page.pagination.previousHref}">← 이전</a>
        <span th:text="${page.pagination.page + ' / ' + page.pagination.totalPages}">1 / 2</span>
        <a th:if="${page.pagination.nextHref != null}" th:href="${page.pagination.nextHref}">다음 →</a>
    </nav>
</section>
</body>
</html>
