<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head(${view.title})}"></head>
<body th:replace="~{ui/layout :: shell('posts', ~{::section})}">
<section>
    <a class="ui-muted" th:href="@{/admin/posts}">← 글 관리</a>
    <div class="ui-page-head">
        <h1 th:text="${view.title}">제목</h1>
    </div>

    <p th:replace="~{ui/layout :: notice(${view.notice?.text}, ${view.notice?.error})}"></p>

    <div class="ui-panel">
        <p>아직 Notion에서 가져온 내용이 없습니다. Notion에서 글을 쓴 뒤 가져오세요.</p>
        <p class="ui-muted nb-small" th:if="${view.source.problem != null}" th:text="${view.source.problem}">문제</p>
        <div class="ui-toolbar">
            <a class="ui-button" th:href="${view.source.editUrl}" target="_blank" rel="noopener noreferrer">Notion에서 수정 ↗</a>
            <form th:action="@{/admin/posts/{id}/refresh(id=${view.postId})}" method="post">
                <button class="ui-button ui-button-primary" type="submit">최신 내용 가져오기</button>
            </form>
            <a class="ui-button" th:href="@{/admin/posts/{id}/categories(id=${view.postId})}">분류 편집</a>
            <form th:if="${view.actions.canArchive}" th:action="@{/admin/posts/{id}/archive(id=${view.postId})}" method="post">
                <button class="ui-button ui-button-danger" type="submit">보관</button>
            </form>
            <form th:if="${view.actions.canRestore}" th:action="@{/admin/posts/{id}/restore(id=${view.postId})}" method="post">
                <button class="ui-button" type="submit">보관 해제</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
