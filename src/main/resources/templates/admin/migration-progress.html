<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('글 마이그레이션 진행')}"></head>
<body th:replace="~{ui/layout :: shell('migrations', ~{::section})}">
<section class="nb-migration-content" data-post-migration>
    <div class="ui-page-head">
        <div>
            <h1>글 마이그레이션</h1>
            <p class="ui-muted nb-lead">글을 하나씩 가져옵니다. 기존 글은 건너뛰고, 새 글은 작성일을 보존한 초안으로 저장합니다.</p>
        </div>
    </div>
    <noscript><p class="ui-notice ui-notice-error">자동으로 가져오려면 JavaScript를 활성화하세요. 아직 마이그레이션을 시작하지 않았습니다.</p></noscript>
    <div data-migration-request th:attr="data-endpoint=@{/admin/migrations/import}" hidden>
        <input type="hidden" name="dataSourceId" th:value="${view.selection.dataSourceId}">
        <input type="hidden" name="titlePropertyId" th:value="${view.selection.fields.titlePropertyId}">
        <input type="hidden" name="summaryPropertyId" th:value="${view.selection.fields.summaryPropertyId}">
        <input type="hidden" name="tagsPropertyId" th:value="${view.selection.fields.tagsPropertyId}">
        <input type="hidden" name="authoredAtPropertyId" th:value="${view.selection.fields.authoredAtPropertyId}">
    </div>
    <div class="ui-panel">
        <h2 id="migration-progress-title">진행 상황</h2>
        <p role="status" aria-live="polite" data-migration-status>마이그레이션을 준비하고 있습니다.</p>
        <p class="ui-muted" data-migration-summary th:text="${'전체 ' + #lists.size(view.rows) + '개'}">전체 0개</p>
        <progress data-migration-progress value="0" th:max="${#lists.isEmpty(view.rows) ? 1 : #lists.size(view.rows)}" aria-label="글 마이그레이션 진행률"></progress>
        <p class="ui-muted nb-small">완료될 때까지 이 화면을 열어 두세요. 화면을 닫아도 저장된 글은 유지되며, 같은 DB로 다시 시작하면 이미 있는 글은 건너뜁니다.</p>
        <div class="ui-toolbar">
            <button class="ui-button" type="button" data-migration-pause>일시 정지</button>
            <button class="ui-button" type="button" data-migration-resume hidden>남은 글 계속 가져오기</button>
            <button class="ui-button" type="button" data-migration-retry hidden>실패한 글만 다시 시도</button>
            <a class="ui-button" th:href="@{/admin/posts}">글 관리에서 미리보기·발행</a>
            <a class="ui-button" th:href="@{/admin/migrations}">다른 데이터베이스 가져오기</a>
        </div>
    </div>
    <th:block th:if="${#lists.isEmpty(view.rows)}">
        <div th:replace="~{ui/layout :: emptyState('가져올 글이 없습니다', '다른 데이터베이스를 선택하거나 원본의 글을 확인하세요.')}"></div>
    </th:block>
    <div class="ui-table-wrap" th:unless="${#lists.isEmpty(view.rows)}">
        <table class="ui-table nb-migration-results">
            <caption>글별 마이그레이션 결과</caption>
            <thead><tr><th scope="col">원본 글</th><th scope="col">처리 결과</th><th scope="col">블로그</th></tr></thead>
            <tbody>
            <tr th:each="row : ${view.rows}" data-migration-row data-state="pending" th:attr="data-source-id=${row.sourceId},data-external-id=${row.externalId}">
                <td><a th:if="${row.sourceHref != null}" th:href="${row.sourceHref}" th:text="${row.title}" target="_blank" rel="noopener noreferrer">원본 글</a>
                    <span th:if="${row.sourceHref == null}" th:text="${row.title}">원본 글</span></td>
                <td data-migration-result>대기 중</td>
                <td><a data-migration-post hidden>미리보기</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <script th:src="@{/app/post-migration.js}" type="module"></script>
</section>
</body>
</html>
