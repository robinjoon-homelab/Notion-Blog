<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head('태그')}"></head>
<body th:replace="~{ui/layout :: shell('categories', ~{::section})}">
<section>
    <div class="ui-page-head">
        <div>
            <h1>태그</h1>
            <p class="ui-muted nb-lead">주제로 글을 찾는 분류입니다. 한 글에 여러 태그를 지정할 수 있고 Notion 원문 태그와는 별개입니다. 필요한 원문 태그는 글의 분류 편집에서 골라 옮깁니다. 이름이나 순서를 저장하면 내 블로그에 바로 반영됩니다.</p>
        </div>
    </div>

    <p th:replace="~{ui/layout :: notice(${view.notice?.text}, ${view.notice?.error})}"></p>

    <form class="ui-panel" th:action="@{/admin/categories}" method="post" aria-label="태그 추가">
        <div class="nb-inline-form">
            <div class="ui-field">
                <label for="new-category-name">새 태그 이름</label>
                <input class="ui-input" id="new-category-name" type="text" name="name" required maxlength="50" autocomplete="off">
            </div>
            <div class="ui-field nb-field-narrow">
                <label for="new-category-position">표시 순서</label>
                <input class="ui-input" id="new-category-position" type="number" name="position" min="0" step="1" value="0" required inputmode="numeric">
            </div>
            <button class="ui-button ui-button-primary" type="submit">추가</button>
        </div>
    </form>

    <th:block th:if="${#lists.isEmpty(view.rows)}">
        <div th:replace="~{ui/layout :: emptyState('아직 태그가 없습니다.', '이름을 입력해 첫 태그를 추가하세요.')}"></div>
    </th:block>
    <ul class="nb-category-list" th:if="${!#lists.isEmpty(view.rows)}">
        <li class="ui-panel" th:each="row, state : ${view.rows}">
            <form th:action="@{/admin/categories/{id}(id=${row.id})}" method="post" th:attr="aria-label=${row.name + ' 수정'}">
                <div class="nb-inline-form">
                    <div class="ui-field">
                        <label th:for="${'category-name-' + state.index}">이름</label>
                        <input class="ui-input" th:id="${'category-name-' + state.index}" type="text" name="name" required maxlength="50" autocomplete="off" th:value="${row.name}">
                    </div>
                    <div class="ui-field nb-field-narrow">
                        <label th:for="${'category-position-' + state.index}">표시 순서</label>
                        <input class="ui-input" th:id="${'category-position-' + state.index}" type="number" name="position" min="0" step="1" required inputmode="numeric" th:value="${row.position}">
                    </div>
                    <button class="ui-button" type="submit">저장</button>
                </div>
            </form>
            <div class="ui-toolbar">
                <span class="ui-muted" th:text="${'글 ' + row.assignedPosts + '개'}">글 0개</span>
                <form th:if="${row.deletable}" th:action="@{/admin/categories/{id}/delete(id=${row.id})}" method="post">
                    <button class="ui-button ui-button-danger" type="submit" th:attr="aria-label=${row.name + ' 삭제'}">삭제</button>
                </form>
                <span class="ui-muted" th:unless="${row.deletable}">글이 지정되어 삭제할 수 없음 (비공개·보관 글 포함)</span>
            </div>
        </li>
    </ul>
</section>
</body>
</html>
