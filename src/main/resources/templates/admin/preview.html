<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{blog/page-fragments :: head(${view.page.chrome}, ${view.page.title})}"></head>
<body class="nb-body-root">
<div class="nb-shell">
    <aside th:replace="~{admin/fragments :: sidebar('posts')}"></aside>
    <div>
        <button type="button" class="nb-button nb-menu" data-toggle-menu aria-expanded="false" aria-controls="nb-sidebar">메뉴</button>
        <main class="nb-main">
            <a class="nb-muted nb-small" href="/admin/posts">← 글 관리</a>
            <div th:replace="~{admin/fragments :: notice(${view.notice})}"></div>
            <div class="nb-toolbar">
                <nav class="nb-filters" aria-label="미리보기 내용 선택">
                    <a class="nb-filter" th:href="@{/admin/posts/{id}(id=${view.panel.postId},version='latest')}" th:attr="aria-current=${!view.panel.actions.showingPublished ? 'true' : null}">가져온 내용</a>
                    <a class="nb-filter" th:if="${view.panel.actions.hasPublished}" th:href="@{/admin/posts/{id}(id=${view.panel.postId},version='published')}" th:attr="aria-current=${view.panel.actions.showingPublished ? 'true' : null}">공개 중인 내용</a>
                </nav>
                <a class="nb-button" th:href="${view.panel.source.editUrl}" target="_blank" rel="noopener noreferrer">Notion에서 수정 ↗</a>
            </div>
            <div class="notion-page nb-preview" th:classappend="${#strings.listJoin(view.page.chrome.profile.classes, ' ')}">
                <article th:replace="~{blog/page-fragments :: article(${view.page})}"></article>
            </div>
            <section class="nb-panel" aria-label="발행">
                <h2 class="nb-panel-title">발행</h2>
                <div th:replace="~{admin/fragments :: panelInfo(${view.panel})}"></div>
                <p class="nb-muted nb-small" th:if="${view.panel.actions.showingPublished}">지금은 공개 중인 내용을 보고 있습니다. 발행은 가져온 내용을 확인한 뒤에 할 수 있습니다.</p>
                <div class="nb-actions">
                    <a class="nb-button nb-primary" th:if="${view.panel.actions.publish != null}" th:href="@{/admin/posts/{id}/review(id=${view.panel.postId})}"
                       th:text="${view.panel.actions.publish.label + ' 확인'}">발행 확인</a>
                    <form th:action="@{/admin/posts/{id}/refresh(id=${view.panel.postId})}" method="post">
                        <button class="nb-button" type="submit">최신 내용 가져오기</button>
                    </form>
                    <a class="nb-button" th:href="@{/admin/posts/{id}/categories(id=${view.panel.postId})}">분류 편집</a>
                    <form th:if="${view.panel.actions.canUnpublish}" th:action="@{/admin/posts/{id}/unpublish(id=${view.panel.postId})}" method="post">
                        <button class="nb-link-danger" type="submit">비공개로 전환</button>
                    </form>
                    <form th:if="${view.panel.actions.canArchive}" th:action="@{/admin/posts/{id}/archive(id=${view.panel.postId})}" method="post">
                        <button class="nb-link-danger" type="submit">보관</button>
                    </form>
                    <form th:if="${view.panel.actions.canRestore}" th:action="@{/admin/posts/{id}/restore(id=${view.panel.postId})}" method="post">
                        <button class="nb-button" type="submit">보관 해제</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
<script src="/ui/notion-shell.js" defer></script>
</body>
</html>
