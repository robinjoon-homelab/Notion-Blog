<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/layout :: head(${view.page.title})}"></head>
<body th:replace="~{ui/layout :: shell('posts', ~{::section})}">
<section>
    <!-- 키트의 head는 글 표현 자산을 싣지 못하므로 본문 앞에서 직접 불러온다. -->
    <link th:each="asset : ${view.page.chrome.styleSheets}" rel="stylesheet" th:href="${asset.publicPath}"
          th:type="${asset.mediaType}" th:integrity="${asset.integrity}" crossorigin="anonymous">
    <script th:each="asset : ${view.page.chrome.scripts}" th:src="${asset.publicPath}" th:type="${asset.mediaType}"
            th:integrity="${asset.integrity}" crossorigin="anonymous" defer></script>

    <a class="ui-muted" th:href="@{/admin/posts}">← 글 관리</a>

    <p th:replace="~{ui/layout :: notice(${view.notice?.text}, ${view.notice?.error})}"></p>

    <div class="ui-toolbar nb-spread">
        <nav class="ui-toolbar" aria-label="미리보기 내용 선택">
            <a class="nb-filter" th:href="@{/admin/posts/{id}(id=${view.panel.postId},version='latest')}" th:attr="aria-current=${!view.panel.actions.showingPublished ? 'true' : null}">가져온 내용</a>
            <a class="nb-filter" th:if="${view.panel.actions.hasPublished}" th:href="@{/admin/posts/{id}(id=${view.panel.postId},version='published')}" th:attr="aria-current=${view.panel.actions.showingPublished ? 'true' : null}">공개 중인 내용</a>
        </nav>
        <a class="ui-button" th:href="${view.panel.source.editUrl}" target="_blank" rel="noopener noreferrer">Notion에서 수정 ↗</a>
    </div>

    <div class="notion-page nb-preview" th:classappend="${#strings.listJoin(view.page.chrome.profile.classes, ' ')}">
        <article th:replace="~{app/blog/page-fragments :: article(${view.page})}"></article>
    </div>

    <div class="ui-panel">
        <h2>발행</h2>
        <div th:replace="~{app/admin/fragments :: panelInfo(${view.panel})}"></div>
        <p class="ui-muted nb-small" th:if="${view.panel.actions.showingPublished}">지금은 공개 중인 내용을 보고 있습니다. 발행은 가져온 내용을 확인한 뒤에 할 수 있습니다.</p>
        <div class="ui-toolbar">
            <a class="ui-button ui-button-primary" th:if="${view.panel.actions.publish != null}" th:href="@{/admin/posts/{id}/review(id=${view.panel.postId})}"
               th:text="${view.panel.actions.publish.label + ' 확인'}">발행 확인</a>
            <form th:action="@{/admin/posts/{id}/refresh(id=${view.panel.postId})}" method="post">
                <button class="ui-button" type="submit">최신 내용 가져오기</button>
            </form>
            <a class="ui-button" th:href="@{/admin/posts/{id}/categories(id=${view.panel.postId})}">분류 편집</a>
            <form th:if="${view.panel.actions.canUnpublish}" th:action="@{/admin/posts/{id}/unpublish(id=${view.panel.postId})}" method="post">
                <button class="ui-button ui-button-danger" type="submit">비공개로 전환</button>
            </form>
            <form th:if="${view.panel.actions.canArchive}" th:action="@{/admin/posts/{id}/archive(id=${view.panel.postId})}" method="post">
                <button class="ui-button ui-button-danger" type="submit">보관</button>
            </form>
            <form th:if="${view.panel.actions.canRestore}" th:action="@{/admin/posts/{id}/restore(id=${view.panel.postId})}" method="post">
                <button class="ui-button" type="submit">보관 해제</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
