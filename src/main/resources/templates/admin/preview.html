<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{blog/page-fragments :: head(${view.page.chrome}, ${view.page.title})}"></head>
<body class="nb-body-root">
<div class="nb-shell">
    <aside th:replace="~{admin/fragments :: sidebar('posts')}"></aside>
    <div>
        <button type="button" class="nb-button nb-menu" data-toggle-menu aria-expanded="false" aria-controls="nb-sidebar">메뉴</button>
        <main class="nb-main">
            <a class="nb-muted nb-small" href="/admin/posts">← 게시글</a>
            <div th:replace="~{admin/fragments :: notice(${view.notice})}"></div>
            <div class="nb-toolbar">
                <nav class="nb-filters" aria-label="미리보기 내용 선택">
                    <a class="nb-filter" th:href="@{/admin/posts/{id}(id=${view.panel.postId},version='latest')}" th:attr="aria-current=${!view.panel.actions.showingPublished ? 'true' : null}">가져온 초안</a>
                    <a class="nb-filter" th:if="${view.panel.actions.hasPublished}" th:href="@{/admin/posts/{id}(id=${view.panel.postId},version='published')}" th:attr="aria-current=${view.panel.actions.showingPublished ? 'true' : null}">공개 중인 글</a>
                </nav>
                <a class="nb-button" th:href="${view.panel.source.editUrl}" target="_blank" rel="noopener noreferrer">Notion에서 작성 ↗</a>
            </div>
            <div class="notion-page nb-preview" th:classappend="${#strings.listJoin(view.page.chrome.profile.classes, ' ')}">
                <article th:replace="~{blog/page-fragments :: article(${view.page})}"></article>
            </div>
            <section class="nb-panel" aria-label="발행 관리">
                <h2 class="nb-panel-title">발행</h2>
                <p><span th:replace="~{admin/fragments :: badges(${view.panel.badges})}"></span></p>
                <div class="nb-property"><span>공개 주소</span>
                    <span><a th:if="${view.panel.publicHref != null}" th:href="${view.panel.publicHref}" th:text="${view.panel.publicHref}">/posts/…</a>
                        <span th:if="${view.panel.publicHref == null}" class="nb-muted">공개되지 않음</span></span></div>
                <div class="nb-property"><span>최근 가져옴</span><span th:text="${view.panel.source.capturedAt}">2026-10-16 14:20</span></div>
                <p class="nb-muted nb-small" th:if="${view.panel.source.problem != null}" th:text="${view.panel.source.problem}">문제</p>
                <p class="nb-muted nb-small" th:if="${view.panel.source.mediaNotice != null}" th:text="${view.panel.source.mediaNotice}">파일</p>
                <p class="nb-muted nb-small" th:if="${view.panel.actions.showingPublished and view.panel.actions.publish == null}">공개 중인 글은 다시 게시할 수 없습니다. 가져온 초안을 확인하세요.</p>
                <div class="nb-actions">
                    <form th:action="@{/admin/posts/{id}/refresh(id=${view.panel.postId})}" method="post">
                        <button class="nb-button" type="submit">최신 내용 가져오기</button>
                    </form>
                    <form th:if="${view.panel.actions.publish != null}" th:action="@{/admin/posts/{id}/publish(id=${view.panel.postId})}" method="post">
                        <input type="hidden" name="revisionId" th:value="${view.panel.actions.publish.revisionId}">
                        <input type="hidden" name="generation" th:value="${view.panel.actions.publish.generation}">
                        <button class="nb-button nb-primary" type="submit" th:text="${view.panel.actions.publish.label}">게시</button>
                    </form>
                    <form th:if="${view.panel.actions.canUnpublish}" th:action="@{/admin/posts/{id}/unpublish(id=${view.panel.postId})}" method="post">
                        <button class="nb-link-danger" type="submit">발행 취소</button>
                    </form>
                    <form th:if="${view.panel.actions.canArchive}" th:action="@{/admin/posts/{id}/archive(id=${view.panel.postId})}" method="post">
                        <button class="nb-link-danger" type="submit">보관</button>
                    </form>
                    <form th:if="${view.panel.actions.canRestore}" th:action="@{/admin/posts/{id}/restore(id=${view.panel.postId})}" method="post">
                        <button class="nb-button" type="submit">보관 해제</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
