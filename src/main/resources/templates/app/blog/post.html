<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${page.chrome.language}">
<head th:replace="~{app/blog/page-fragments :: head(${page.chrome}, ${page.title})}"></head>
<body class="blog-public">
<main class="notion-page" th:classappend="${#strings.listJoin(page.chrome.profile.classes, ' ')}">
    <header th:replace="~{app/blog/page-fragments :: header(${page.chrome})}"></header>
    <div class="notion-content"><p><a href="/">← 모든 글</a></p></div>
    <article th:replace="~{app/blog/page-fragments :: article(${page})}"></article>
    <footer th:replace="~{app/blog/page-fragments :: footer(${page.chrome})}"></footer>
    <div class="notion-content" th:if="${page.chrome.feedUrl != null}"><p><a th:href="${page.chrome.feedUrl}">RSS 구독</a></p></div>
</main>
</body>
</html>
